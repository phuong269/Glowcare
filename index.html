<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GlowCare - Chăm sóc da</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --green-primary: #1f422b;
            --green-accent: #3d6e49;
            --pink-accent: #a45c70;
            --text-dark: #2a382e;
            --text-muted: #4e5f52;
            --glass-bg: rgba(255, 255, 255, 0.88);
            --glass-border: rgba(255, 255, 255, 0.7);
        }

        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            color: var(--text-dark);
            min-height: 100vh;

            /* NỀN HÌNH HOA LÁ THIÊN NHIÊN SẮC NÉT */
            background-image: 
                linear-gradient(rgba(240, 247, 241, 0.45), rgba(240, 247, 241, 0.45)),
                url("https://images.unsplash.com/photo-1518531933037-91b2f5f229cc?auto=format&fit=crop&w=2000&q=90");
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;
        }

        .page {
            min-height: 100vh;
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 8%;
            flex-wrap: wrap;
            gap: 15px;
            background: rgba(255, 255, 255, 0.75);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border-bottom: 1px solid var(--glass-border);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .logo {
            font-size: 26px;
            font-weight: bold;
            color: var(--green-primary);
            letter-spacing: 0.5px;
        }

        nav {
            display: flex;
            gap: 28px;
            flex-wrap: wrap;
        }

        nav a {
            text-decoration: none;
            color: var(--green-primary);
            font-weight: 600;
            transition: color 0.3s;
        }

        nav a:hover {
            color: var(--pink-accent);
        }

            max-width: 1200px;
            margin: 50px auto;
